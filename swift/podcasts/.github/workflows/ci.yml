name: ci

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  main:
    runs-on: macos-15
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 16.4.0
      - uses: actions/cache@v4
        with:
          path: |
            lib-tca/.build
            lib-core/.build
            lib-views/.build
          key: podcasts-xc16.4.0-${{ hashFiles('lib-tca/Package.resolved', 'lib-core/Package.resolved', 'lib-views/Package.resolved') }}
          restore-keys: podcasts-xc16.4.0-
      - name: setup just
        uses: extractions/setup-just@v2
      - name: build
        run: just build
      - name: test
        run: just test
        env:
          SWIFT_DETERMINISTIC_HASHING: 1

  swiftformat:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: build
        run: |
          git clone --depth 1 --branch 0.55.5 https://github.com/nicklockwood/SwiftFormat
          cd SwiftFormat && swift build -c debug
          cp ./.build/debug/swiftformat /usr/local/bin
          cd ../ && rm -rf SwiftFormat/
      - name: swiftlint
        run: /usr/local/bin/swiftformat . --lint

concurrency:
  group: ${{ github.ref }}-ci
  cancel-in-progress: true
