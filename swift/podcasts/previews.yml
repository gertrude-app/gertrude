name: GertiePodcastsPreviews
options:
  deploymentTarget:
    iOS: "18.0"

configs:
  Debug: debug
  Release: debug

settings:
  base:
    SWIFT_OPTIMIZATION_LEVEL: "-Onone"

targets:
  App:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: previews/sources
      - path: previews/Assets.xcassets
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        PRODUCT_NAME: "GertiePodcastsPreviews"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "com.netrivet.gertrude.am.previews"
        DEVELOPMENT_TEAM: "WFN83LM943"
        CODE_SIGN_STYLE: Automatic
schemes:
  App:
    build:
      targets:
        App: all
    profile:
      config: Debug
    archive:
      config: Debug
