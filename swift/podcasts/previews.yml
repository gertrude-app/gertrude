name: GertiePodcastsPreviews
options:
  deploymentTarget:
    iOS: "17.0"
  postGenCommand: python3 ../fix-gertie-ui-package-backlink.py GertiePodcastsPreviews.xcodeproj/project.pbxproj ../../gertie-ui

configs:
  Debug: debug
  Release: debug

settings:
  base:
    SWIFT_OPTIMIZATION_LEVEL: "-Onone"

packages:
  GertieUI:
    path: ../gertie-ui

targets:
  App:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: previews/sources
      - path: previews/Assets.xcassets
    dependencies:
      - package: GertieUI
        product: GertieUI
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        PRODUCT_NAME: "GertiePodcastsPreviews"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "com.netrivet.gertrude.am.previews"
        DEVELOPMENT_TEAM: "WFN83LM943"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
schemes:
  App:
    build:
      targets:
        App: all
    profile:
      config: Debug
    archive:
      config: Debug
