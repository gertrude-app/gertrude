name: GertiePodcasts
options:
  deploymentTarget:
    iOS: "18.0"

configs:
  Debug: debug
  Release: release

targets:
  'Gertrude AM':
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: app/sources
        group: app
      - path: app/Assets.xcassets
        group: app
      - path: app/LaunchScreen.storyboard
        group: app
    dependencies:
      - package: LibCore
      - package: LibViews
      - package: LibTCA
    settings:
      base:
        DEVELOPMENT_TEAM: "WFN83LM943"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: app/Info.plist
        MARKETING_VERSION: 0.0.5
        CURRENT_PROJECT_VERSION: 5
      configs:
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: "com.netrivet.gertrude.am"
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: "com.netrivet.gertrude.am.dev"
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
    info:
      path: app/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: Gertrude AM
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UILaunchStoryboardName: LaunchScreen
        UIBackgroundModes:
          - audio
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          # NB: keep in sync with keys in BackgroundTasks.swift
          - com.netrivet.gertrude.am.refresh-feed
          - com.netrivet.gertrude.am.download-episodes

packages:
  LibCore:
    path: ./lib-core
  LibViews:
    path: ./lib-views
  LibTCA:
    path: ./lib-tca
