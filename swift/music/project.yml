name: GertrudeMusic
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions:
    - en

configs:
  Debug: debug
  Release: release

targets:
  "Gertrude Music":
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: app/sources
        group: app
      - path: app/Assets.xcassets
        group: app
      - path: app/AppIcon.icon
        group: app
        buildPhase: resources
      - path: app/AppIconDev.icon
        group: app
        buildPhase: resources
      - path: app/LaunchScreen.storyboard
        group: app
    dependencies:
      - package: LibTCA
        product: LibTCA
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        PRODUCT_NAME: "Gertrude Music"
        DEVELOPMENT_TEAM: "WFN83LM943"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 8
        ALWAYS_SEARCH_USER_PATHS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          DEVELOPMENT_TEAM: "WFN83LM943"
          PRODUCT_BUNDLE_IDENTIFIER: "com.netrivet.gertrude.music"
          API_ENDPOINT: "https://api.gertrude.app"
        Debug:
          ONLY_ACTIVE_ARCH: YES
          CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: YES
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
          INFOPLIST_FILE: app/Info.Debug.plist
          DEVELOPMENT_TEAM: "${GERTRUDE_MUSIC_DEBUG_DEVELOPMENT_TEAM}"
          PRODUCT_BUNDLE_IDENTIFIER: "${GERTRUDE_MUSIC_DEBUG_BUNDLE_IDENTIFIER}"
          API_ENDPOINT: "${LOCAL_API_ENDPOINT}"
    info:
      path: app/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: Gertrude Music
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleLocalizations:
          - en
        API_ENDPOINT: $(API_ENDPOINT)
        NSAppleMusicUsageDescription: Gertrude Music needs access to Apple Music to play approved music.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchStoryboardName: LaunchScreen
        UIBackgroundModes:
          - audio
schemes:
  "Gertrude Music":
    build:
      targets:
        "Gertrude Music": all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

packages:
  LibViews:
    path: ./lib-views
  LibTCA:
    path: ./lib-tca
