name: GertrudeMusic
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions:
    - en

configs:
  Debug: debug
  Release: release

targets:
  "Gertrude Music":
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: app/sources
        group: app
      - path: app/AppIcon.icon
        group: app
        buildPhase: resources
    dependencies:
      - package: LibTCA
        product: LibTCA
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        PRODUCT_NAME: "Gertrude Music"
        DEVELOPMENT_TEAM: "Y63PLK783B"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 0.3.0
        CURRENT_PROJECT_VERSION: 1
        ALWAYS_SEARCH_USER_PATHS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: "com.netrivet.gertrude.fm"
          API_ENDPOINT: "https://api.gertrude.app"
        Debug:
          ONLY_ACTIVE_ARCH: YES
          CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: YES
          PRODUCT_BUNDLE_IDENTIFIER: "com.innocencelabs.gertrude-fm-temp-dev"
          API_ENDPOINT: "${GERTRUDE_MUSIC_DEBUG_API_ENDPOINT}"
    info:
      path: app/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: Gertrude Music
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        API_ENDPOINT: $(API_ENDPOINT)
        NSAppleMusicUsageDescription: Gertrude Music needs access to Apple Music to play approved music.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
    postBuildScripts:
      - name: Add debug local API Info.plist keys
        script: |
          if [ "$CONFIGURATION" != "Debug" ]; then
            exit 0
          fi
          case "$API_ENDPOINT" in
            http://*) ;;
            *) exit 0 ;;
          esac
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsLocalNetworking true" "$plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$plist"
          /usr/libexec/PlistBuddy -c "Set :NSLocalNetworkUsageDescription Gertrude Music connects to a local development API while testing." "$plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string Gertrude Music connects to a local development API while testing." "$plist"
        basedOnDependencyAnalysis: false
        showEnvVars: false

schemes:
  "Gertrude Music":
    build:
      targets:
        "Gertrude Music": all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

packages:
  LibViews:
    path: ./lib-views
  LibTCA:
    path: ./lib-tca
