name: GertieUICatalog
options:
  deploymentTarget:
    iOS: "17.0"
  postGenCommand: python3 fix-local-package-backlink.py

packages:
  GertieUI:
    path: ..

targets:
  "Gertie UI Catalog":
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    dependencies:
      - package: GertieUI
        product: GertieUI
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        PRODUCT_NAME: "Gertie UI Catalog"
        PRODUCT_BUNDLE_IDENTIFIER: "${GERTRUDE_UI_CATALOG_BUNDLE_IDENTIFIER}"
        DEVELOPMENT_TEAM: "${GERTRUDE_UI_CATALOG_DEVELOPMENT_TEAM}"
        CODE_SIGN_STYLE: Automatic
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "Gertie UI Catalog"
        UILaunchScreen: {}

schemes:
  "Gertie UI Catalog":
    build:
      targets:
        "Gertie UI Catalog": all
    run:
      config: Debug
    analyze:
      config: Debug
