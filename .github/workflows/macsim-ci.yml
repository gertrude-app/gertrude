name: macsim-ci

on:
  pull_request:
    paths:
      - 'swift/macapp/**'
      - 'swift/pairql-macapp/**'
      - 'swift/pairql/**'
      - 'swift/gertie/**'
      - 'swift/x-kit/**'
      - 'swift/x-expect/**'
      - 'swift/ts-interop/**'
      - 'swift/ts-codable-macro/**'
      - 'swift/justfile'
      - '.github/workflows/macsim-ci.yml'
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

jobs:
  macsim-pr:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26.1.1
      - uses: actions/cache@v4
        with:
          path: swift/macapp/App/.build
          key: macsim-xc26.1.1-${{ hashFiles('swift/macapp/App/Package.resolved') }}
          restore-keys: macsim-xc26.1.1-
      - name: macsim per-pr corpus
        run: |
          cd swift/macapp/App
          SWIFT_DETERMINISTIC_HASHING=1 swift test --filter MacSimTests

  macsim-hunt:
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26.1.1
      - uses: actions/cache@v4
        with:
          path: swift/macapp/App/.build
          key: macsim-xc26.1.1-${{ hashFiles('swift/macapp/App/Package.resolved') }}
          restore-keys: macsim-xc26.1.1-
      - name: macsim seed hunt
        run: |
          cd swift/macapp/App
          SWIFT_DETERMINISTIC_HASHING=1 EXPLORE_SEEDS=80 EXPLORE_STEPS=45 swift test --filter MacExplorerTests
