name: podcasts-ci

on:
  push:
    branches:
      - master
    paths:
      - 'swift/podcasts/**'
      - '.github/workflows/podcasts-ci.yml'
  pull_request:
    paths:
      - 'swift/podcasts/**'
      - '.github/workflows/podcasts-ci.yml'

jobs:
  main:
    runs-on: macos-15
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26.1.1
      - uses: actions/cache@v4
        with:
          path: |
            swift/podcasts/lib-tca/.build
            swift/podcasts/lib-core/.build
            swift/podcasts/lib-views/.build
          key: podcasts-xc26.1.1-${{ hashFiles('swift/podcasts/lib-tca/Package.resolved', 'swift/podcasts/lib-core/Package.resolved', 'swift/podcasts/lib-views/Package.resolved') }}
          restore-keys: podcasts-xc26.1.1-
      - name: setup just
        uses: extractions/setup-just@v2
      - name: build
        run: cd swift/podcasts && just build
      - name: test
        run: cd swift/podcasts && just test
        env:
          SWIFT_DETERMINISTIC_HASHING: 1

  swiftformat:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: build
        run: |
          git clone --depth 1 --branch 0.58.5 https://github.com/nicklockwood/SwiftFormat
          cd SwiftFormat && swift build -c debug
          cp ./.build/debug/swiftformat /usr/local/bin
          cd ../ && rm -rf SwiftFormat/
      - name: swiftlint
        run: cd swift/podcasts && /usr/local/bin/swiftformat . --lint

concurrency:
  group: ${{ github.ref }}-podcasts-ci
  cancel-in-progress: true
