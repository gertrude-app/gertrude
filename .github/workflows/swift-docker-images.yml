name: swift-docker-images

on:
  push:
    branches:
      - master
    paths:
      - 'swift/api/Dockerfile.ci'
      # rebuild so the image's prewarmed api dependencies stay in sync with the resolved graph
      - 'swift/api/Package.resolved'

jobs:
  build-ci-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: extract swift version
        id: swift-version
        run: |
          VERSION=$(grep "swiftly install" swift/api/Dockerfile.ci | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+' | head -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: login to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/api-ci-build
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.swift-version.outputs.version }}
            type=sha,prefix={{branch}}-
      - name: build and push ci image
        uses: docker/build-push-action@v5
        with:
          context: ./swift
          file: ./swift/api/Dockerfile.ci
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
